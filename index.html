<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foxboro Modernization Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>FOXBORO PNEUMATIC SYSTEM MODERNIZATION SIMULATOR</h1>

<div class="toolbar">
<button onclick="loadScenario('existing')">Existing System</button>
<button onclick="loadScenario('modular')">Modular Replacement</button>
<button onclick="loadScenario('electronic')">Electronic Upgrade</button>
<button onclick="loadScenario('dcs')">DCS / SCADA</button>
<button onclick="loadScenario('cabinet')">Cabinet View</button>
</div>

<div id="scenarioTitle"></div>

<svg id="diagram" viewBox="0 0 1200 700"></svg>

<div class="calc">
<h3>Live Signal Calculator</h3>
<input type="range" min="0" max="800" value="400" id="temp">
<div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
